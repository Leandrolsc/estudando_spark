x-spark-common: &spark-common
  build:
    context: ./spark
  volumes:
    - ./jobs:/opt/spark/work-dir/jobs
    - ./data:/opt/spark/work-dir/data

x-spark-worker-env: &spark-worker-env
  SPARK_MODE: worker
  SPARK_MASTER_URL: spark://spark-master:7077
  SPARK_WORKER_MEMORY: 1G
  SPARK_WORKER_CORES: 1

services:
  spark-master:
    <<: *spark-common 
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master

  spark-worker-1:
    <<: *spark-common 
    container_name: spark-worker-1
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"
    environment:
      <<: *spark-worker-env 

  spark-worker-2:
    <<: *spark-common 
    container_name: spark-worker-2
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8082:8081"
    environment:
      <<: *spark-worker-env 

  jupyter-lab:
    <<: *spark-common 
    container_name: jupyter-lab
    ports:
      - "8888:8888"
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --notebook_dir=/opt/spark/work-dir/jobs --NotebookApp.token='' --NotebookApp.password=''

